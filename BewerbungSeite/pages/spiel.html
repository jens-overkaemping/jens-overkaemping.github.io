<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktiver Mathe-Trainer mit fallenden Rechenaufgaben, Combo-System und Highscore.">
    <title>Fallende Mathe-Challenge 🚀</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-image: url('../assets/neon-bg.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #00d2ff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            text-align: center;
            width: 100%;
            max-width: 440px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            color: #00d2ff;
            margin: 0 0 5px;
            font-size: 24px;
        }

        .combo-badge {
            font-size: 16px;
            color: #ff0055;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 24px;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .box-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .falling-question {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            font-size: 28px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 10px #00d2ff;
        }

        .game-input {
            width: 140px;
            padding: 10px;
            font-size: 22px;
            border-radius: 5px;
            border: 2px solid #00d2ff;
            background: #030712;
            color: white;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        .game-input:focus {
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .game-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
            flex-wrap: wrap;
        }

        .score-display { color: #00ffcc; }
        .highscore-display { color: #ffaa00; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #a0aec0;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover { color: #00d2ff; }

        .game-over {
            display: none;
            margin-top: 20px;
        }

        .game-over h2 { color: #ff0055; }

        .restart-btn {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .restart-btn:hover {
            background: #00ffcc;
            color: #030712;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .game-container { padding: 18px; }
            h1 { font-size: 21px; }
            .box-container { height: 320px; }
            .falling-question { font-size: 25px; }
            .stats-container { font-size: 16px; }
        }
    </style>
</head>

<body>

    <main class="game-container" id="gameCard">

        <h1>Math Drop Ultimate 🧠☄️</h1>

        <div class="combo-badge" id="comboText" aria-live="polite"></div>

        <div class="box-container" id="gameArea">
            <div class="falling-question" id="questionText">
                Berechne...
            </div>
        </div>

        <input
            type="number"
            id="userInput"
            class="game-input"
            placeholder="?"
            aria-label="Ergebnis eingeben"
            autocomplete="off"
            inputmode="numeric"
            disabled
        >

        <div class="stats-container">
            <div class="score-display">
                Punkte: <span id="scoreText">0</span>
            </div>

            <div class="highscore-display">
                🏆 Highscore: <span id="highscoreText">0</span>
            </div>
        </div>

        <div class="game-over" id="gameOver">
            <h2>Game Over! 💥</h2>
            <p>Deine Punkte: <strong id="finalScore">0</strong></p>
            <button type="button" class="restart-btn" id="restartBtn">
                Nochmal spielen
            </button>
        </div>

        <a href="../../index.html" class="back-link">
            ← Zurück zur Startseite
        </a>

    </main>

    <script>
        let num1;
        let num2;
        let correctAnswer;

        let score = 0;
        let highscore = 0;

        let currentY = 0;
        const startSpeed = 1.2;
        let fallSpeed = startSpeed;

        let gameInterval = null;
        let answerTimeout = null;
        let isGameOver = false;

        let comboCount = 0;
        let multiplier = 1;
        let lastSolveTime = 0;
        let canAnswer = true;

        const gameCard = document.getElementById("gameCard");
        const gameArea = document.getElementById("gameArea");
        const questionText = document.getElementById("questionText");
        const userInput = document.getElementById("userInput");
        const scoreText = document.getElementById("scoreText");
        const highscoreText = document.getElementById("highscoreText");
        const comboText = document.getElementById("comboText");
        const gameOverBox = document.getElementById("gameOver");
        const finalScore = document.getElementById("finalScore");
        const restartBtn = document.getElementById("restartBtn");

        function loadHighscore() {
            try {
                const savedHighscore =
                    localStorage.getItem("mathDropHighscore");

                if (savedHighscore !== null) {
                    const parsed = Number.parseInt(savedHighscore, 10);

                    if (Number.isFinite(parsed) && parsed >= 0) {
                        highscore = parsed;
                    }
                }
            } catch (error) {
                highscore = 0;
            }

            highscoreText.textContent = highscore;
        }

        function updateHighscore() {
            if (score > highscore) {
                highscore = score;
                highscoreText.textContent = highscore;

                try {
                    localStorage.setItem("mathDropHighscore", highscore);
                } catch (error) {
                    // Das Spiel funktioniert auch ohne lokalen Speicher.
                }
            }
        }

        function generateQuestion() {
            if (isGameOver) return;

            const operators = ["+", "-", "*"];
            const operator = operators[
                Math.floor(Math.random() * operators.length)
            ];

            if (operator === "+") {
                num1 = Math.floor(Math.random() * 20) + 1;
                num2 = Math.floor(Math.random() * 20) + 1;
                correctAnswer = num1 + num2;

            } else if (operator === "-") {
                num1 = Math.floor(Math.random() * 20) + 5;
                num2 = Math.floor(Math.random() * num1) + 1;
                correctAnswer = num1 - num2;

            } else {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = num1 * num2;
            }

            const displayOperator = operator === "*" ? "×" : operator;

            questionText.textContent =
                num1 + " " + displayOperator + " " + num2;

            currentY = 0;
            questionText.style.top = "0px";

            userInput.value = "";
        }

        function startFalling() {
            clearInterval(gameInterval);

            gameInterval = setInterval(() => {
                if (isGameOver || !canAnswer) return;

                currentY += fallSpeed;
                questionText.style.top = currentY + "px";

                const maxY =
                    gameArea.clientHeight - questionText.offsetHeight;

                if (currentY >= maxY) {
                    endGame();
                }
            }, 30);
        }

        function endGame() {
            if (isGameOver) return;

            clearInterval(gameInterval);
            gameInterval = null;

            clearTimeout(answerTimeout);
            answerTimeout = null;

            isGameOver = true;
            canAnswer = false;

            updateHighscore();

            userInput.disabled = true;
            finalScore.textContent = score;
            gameOverBox.style.display = "block";

            comboCount = 0;
            multiplier = 1;
            comboText.textContent = "";

            gameCard.style.borderColor = "#ff0055";
            gameCard.style.boxShadow =
                "0 0 30px rgba(255, 0, 85, 0.8)";
        }

        function updateSpeed() {
            if (score < 15) {
                fallSpeed = startSpeed + (score * 0.03);

            } else if (score < 40) {
                fallSpeed = startSpeed + 0.45 + ((score - 15) * 0.05);

            } else {
                fallSpeed = startSpeed + 1.7 + ((score - 40) * 0.1);
            }

            // Verhindert eine zu hohe Spielgeschwindigkeit.
            fallSpeed = Math.min(fallSpeed, 8);
        }

        function checkAnswer() {
            if (!canAnswer || isGameOver) return;

            const userAnswer = Number(userInput.value);

            if (
                userInput.value.trim() === "" ||
                !Number.isFinite(userAnswer) ||
                userAnswer !== correctAnswer
            ) {
                return;
            }

            canAnswer = false;
            userInput.value = "";

            const now = Date.now();
            const timeTaken = (now - lastSolveTime) / 1000;

            lastSolveTime = now;

            if (timeTaken <= 1.8) {
                comboCount++;

                if (comboCount >= 6) {
                    multiplier = 3;
                    comboText.textContent = "🔥 Mega Combo x3! 🔥";

                } else if (comboCount >= 3) {
                    multiplier = 2;
                    comboText.textContent = "⚡ Combo x2! ⚡";

                } else {
                    multiplier = 1;
                    comboText.textContent = "";
                }

            } else {
                comboCount = 1;
                multiplier = 1;
                comboText.textContent = "";
            }

            score += multiplier;
            scoreText.textContent = score;

            updateHighscore();
            updateSpeed();

            gameCard.style.borderColor = "#00ffcc";
            gameCard.style.boxShadow =
                "0 0 30px rgba(0, 255, 204, 0.8)";

            clearInterval(gameInterval);
            gameInterval = null;

            answerTimeout = setTimeout(() => {
                answerTimeout = null;

                if (isGameOver) return;

                gameCard.style.borderColor = "#00d2ff";
                gameCard.style.boxShadow =
                    "0 0 20px rgba(0, 210, 255, 0.3)";

                generateQuestion();

                canAnswer = true;
                startFalling();
                userInput.focus();

            }, 200);
        }

        function restartGame() {
            clearInterval(gameInterval);
            clearTimeout(answerTimeout);

            gameInterval = null;
            answerTimeout = null;

            score = 0;
            fallSpeed = startSpeed;
            currentY = 0;

            comboCount = 0;
            multiplier = 1;
            lastSolveTime = Date.now();

            isGameOver = false;
            canAnswer = true;

            scoreText.textContent = "0";
            comboText.textContent = "";

            gameOverBox.style.display = "none";
            userInput.disabled = false;

            gameCard.style.borderColor = "#00d2ff";
            gameCard.style.boxShadow =
                "0 0 20px rgba(0, 210, 255, 0.3)";

            generateQuestion();
            startFalling();
            userInput.focus();
        }

        userInput.addEventListener("input", checkAnswer);

        userInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        restartBtn.addEventListener("click", restartGame);

        // Spiel initialisieren.
        loadHighscore();
        lastSolveTime = Date.now();
        generateQuestion();
        userInput.disabled = false;
        startFalling();
        userInput.focus();
    </script>

</body>
</html>
